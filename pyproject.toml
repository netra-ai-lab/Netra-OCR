[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-ocr"
version = "1.1.0"
description = "Khmer OCR engine using a Squeeze-and-Excitation Transformer network for text-line recognition, with pluggable text detectors (YOLO, Tesseract, classic CV)."
readme = "readme.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nhem Darayut", email = "darayutnhem009@gmail.com"},
]
keywords = ["khmer", "ocr", "text-recognition", "transformer", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core dependencies — enough to use the recognizer standalone
# (netra_ocr.recognition.recognize_text.recognize / recognize_batch) on your
# own crops, plus the classic-CV ("legacy") detector, which is pure
# cv2/numpy and needs nothing extra. The YOLO and Tesseract detectors pull in
# additional deps -- see the "yolo" / "tesseract" extras below -- so a plain
# `pip install netra-ocr` does not require them.
dependencies = [
    "pillow>=10.2.0,<11.0.0",
    "numpy",
    "opencv-python",
    "tqdm",
    "transformers>=4.47.0,<5.0.0",
    "torch>=2.0",
    "torchvision",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
# The bundled YOLO detector backend (netra_ocr/detectors/yolo.py).
yolo = ["ultralytics"]
# The Tesseract detector backend (netra_ocr/engine.py) pulls in heavier deps and
# also needs the system Tesseract binary installed separately.
tesseract = ["pytesseract", "scipy", "scikit-image", "networkx"]
# .docx output support (netra_ocr/output_formatters.py) -- only needed when
# using the full KhmerOCRPipeline with a .docx output path; not required by
# the recognizer or any detector on its own.
docx = ["python-docx"]
# DocLayout-YOLO page layout analysis (KhmerOCRPipeline(layout=True)).
# Note: doclayout-yolo, like ultralytics, is AGPL-3.0 -- see THIRD_PARTY_LICENSES.md.
layout = ["doclayout-yolo"]
# PDF input (rendered with pdfium).
pdf = ["pypdfium2"]
# The web app + REST API (netra_ocr serve). Pulls in everything it uses.
server = ["fastapi", "uvicorn[standard]", "python-multipart", "netra-ocr[yolo,tesseract,layout,pdf,docx]"]
# Kept for backwards compatibility: the old Flask UI was replaced by the server.
web = ["netra-ocr[server]"]
# Everything: every detector, layout analysis, PDF, all output formats, the server.
full = ["netra-ocr[yolo,tesseract,docx,layout,pdf,server]"]

[project.urls]
Homepage = "https://github.com/netra-ai-lab/Khmer-OCR-CNN-Transformer"
Repository = "https://github.com/netra-ai-lab/Khmer-OCR-CNN-Transformer"
"Model Download" = "https://huggingface.co/Darayut/khmer-text-recognition"

[project.scripts]
netra_ocr = "netra_ocr.ocr_engine:main"

[tool.setuptools.packages.find]
include = ["netra_ocr*"]
# netra_ocr.recognition.scripts is training/eval tooling (train.py,
# evaluate_*.py, finetune_vlm_khmer.py, ...), several of which import deps
# (datasets, unsloth, ...) that aren't declared anywhere for the published
# package. Kept in git, excluded from the wheel -- production installs only
# need the inference path (detectors + recognition/model + predictor).
exclude = ["netra_ocr.recognition.scripts", "netra_ocr.recognition.scripts.*"]
# Without this, setuptools treats any directory under netra_ocr* as an
# implicit PEP 420 namespace package even without __init__.py, which would
# pull netra_ocr/recognition/archive/ (intentionally not a package -- see
# its own contents) into the wheel.
namespaces = false

[tool.setuptools]
# Keep this false: with include-package-data the build would pull in EVERY git-tracked
# file inside the packages (all ~600 MB of checkpoints), ignoring the selective globs
# below. Only the explicit package-data globs are shipped in the wheel.
include-package-data = false

# The YOLO detector weights are bundled (~20 MB) since they're small and needed
# immediately. The recognition weight is NOT bundled -- it's ~77 MB, so it's
# downloaded on first use from https://huggingface.co/Darayut/khmer-text-recognition
# and cached locally by huggingface_hub instead. Only the (tiny) vocab JSON
# files are bundled here.
[tool.setuptools.package-data]
"netra_ocr.detectors" = ["yolo26s_best/best.pt", "yolo26s_best/args.yaml"]
"netra_ocr.recognition" = ["*.json"]
"netra_ocr.server" = ["static/*.html", "static/*.css", "static/*.svg", "static/js/*.js", "static/fonts/*.woff2"]
