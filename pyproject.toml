[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-ocr"
version = "1.2.0"
description = "Khmer OCR engine using a Squeeze-and-Excitation Transformer network for text-line recognition, with pluggable text detectors (YOLO, Tesseract, classic CV)."
readme = "readme.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nhem Darayut", email = "darayutnhem009@gmail.com"},
]
keywords = ["khmer", "ocr", "text-recognition", "transformer", "deep-learning", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core dependencies: the whole OCR pipeline runs on Netra Runtime (ONNX
# Runtime), with no PyTorch. Models are Netra Runtime bundles downloaded on
# first use from https://huggingface.co/Netra-Lab/Netra-OCR. Pick exactly one
# ONNX Runtime build through the "cpu" or "gpu" extra (they can't be installed
# side by side).
dependencies = [
    "pillow>=10.2.0,<11.0.0",
    "numpy",
    "opencv-python",
    "netra-runtime>=0.1.0",
]

[project.optional-dependencies]
cpu = ["netra-runtime[cpu]>=0.1.0"]
gpu = ["netra-runtime[gpu]>=0.1.0"]
# The Tesseract detector backend (netra_ocr/engine.py) pulls in heavier deps and
# also needs the system Tesseract binary installed separately.
tesseract = ["pytesseract", "scipy", "scikit-image", "networkx"]
# .docx output support.
docx = ["python-docx"]
# PDF input (rendered with pdfium).
pdf = ["pypdfium2"]
# The web app + REST API (netra_ocr serve). Add "cpu" or "gpu" for the runtime.
server = ["fastapi", "uvicorn[standard]", "python-multipart", "netra-ocr[tesseract,pdf,docx]"]
# Kept for backwards compatibility: the YOLO detector and layout analysis are
# part of the core now, and the old Flask UI was replaced by the server.
yolo = []
layout = []
web = ["netra-ocr[server]"]
# Everything, on CPU.
full = ["netra-ocr[cpu,tesseract,docx,pdf,server]"]
# Research only: training, evaluation and exporting models to bundles
# (netra_ocr/recognition/scripts, netra-runtime export-yolo). Note:
# ultralytics and doclayout-yolo are AGPL-3.0 -- see THIRD_PARTY_LICENSES.md.
research = ["torch>=2.0", "torchvision", "tqdm", "netra-runtime[export]>=0.1.0",
            "ultralytics", "doclayout-yolo"]

[project.urls]
Homepage = "https://github.com/netra-ai-lab/Khmer-OCR-CNN-Transformer"
Repository = "https://github.com/netra-ai-lab/Khmer-OCR-CNN-Transformer"
"Model Download" = "https://huggingface.co/Netra-Lab/Netra-OCR"
"PyTorch weights" = "https://huggingface.co/Darayut/khmer-text-recognition"

[project.scripts]
netra_ocr = "netra_ocr.ocr_engine:main"

[tool.setuptools.packages.find]
include = ["netra_ocr*"]
# netra_ocr.recognition.scripts is training/eval tooling (train.py,
# evaluate_*.py, finetune_vlm_khmer.py, ...), several of which import deps
# (datasets, unsloth, ...) that aren't declared anywhere for the published
# package. Kept in git, excluded from the wheel -- production installs only
# need the inference path (netra_ocr.models + detectors + recognize_text).
exclude = ["netra_ocr.recognition.scripts", "netra_ocr.recognition.scripts.*"]
# Without this, setuptools treats any directory under netra_ocr* as an
# implicit PEP 420 namespace package even without __init__.py, which would
# pull netra_ocr/recognition/archive/ (intentionally not a package -- see
# its own contents) into the wheel.
namespaces = false

[tool.setuptools]
# Keep this false: with include-package-data the build would pull in EVERY git-tracked
# file inside the packages (all ~600 MB of checkpoints), ignoring the selective globs
# below. Only the explicit package-data globs are shipped in the wheel.
include-package-data = false

# Models are not bundled: they're Netra Runtime bundles downloaded on first use
# (see netra_ocr/models.py). Only the static UI and small JSON files ship.
[tool.setuptools.package-data]
"netra_ocr.recognition" = ["*.json"]
"netra_ocr.server" = ["static/*.html", "static/*.css", "static/*.svg", "static/js/*.js", "static/fonts/*.woff2"]

